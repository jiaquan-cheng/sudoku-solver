name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry' 
      - name: Install Dependencies
        run: |
          pipx install poetry
          poetry install --with dev
      - name: Run Ruff
        run: poetry run ruff check .

  test:
    needs: lint 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry' 
      - name: Install Dependencies
        run: |
          pipx install poetry
          poetry install --with dev 
      - name: Run Tests
        run: poetry run pytest