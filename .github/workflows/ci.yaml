name: CI

on: [push, pull_request]

jobs:

  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry'
      - name: Install Dependencies
        run: poetry install --with dev
      
      - name: Run Linting and Tests
        run: |
          make lint
          make test