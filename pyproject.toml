[project]
name = "sudoku-solver"
version = "0.1.0"
description = ""
authors = [
    {name = "jiaquan-cheng",email = "j.q.cheng@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "z3-solver (>=4.16.0.0,<5.0.0.0)",
    "streamlit (>=1.58.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
solve = "sudoku_solver.__main__:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.17,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
